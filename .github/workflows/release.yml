name: Release

on:
  push:
    tags:
      # 'r*' is the current scheme: a release name carries NO plugin version
      # (the repo ships six independently versioned plugins), so names are
      # date-based identifiers like r2026.08.20. 'v*' stays for the historical
      # tags and for the one transitional v1.0.28 release that lets installs
      # running the old tag-comparing auto-updater upgrade themselves.
      - 'v*'
      - 'r*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build per-OS tarballs
        run: bash scripts/build-release.sh

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading assets"
            gh release upload "$TAG" dist/*.tar.gz dist/versions.json --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*.tar.gz dist/versions.json
          fi
